        function capflt(val) {
            return String(val).charAt(0).toUpperCase() + String(val).slice(1);
        };
        function response(){
            const wordmount = Math.floor(Math.random() * 10);
            let sentencef = []
            for (let i = 0; i < wordmount; i++) {
                const numbword = Math.floor(Math.random()*possibility.length);
                const pickedword = possibility[numbword];
                const prob = ranint(100);
                console.log(prob)
                if (prob > 50) {
                    console.log("wow")
                    const numberedre = Math.floor(Math.random()*refers.length);
                    const actualchosenword = refers[numberedre];
                    sentencef.push(actualchosenword);
                }
                sentencef.push(pickedword);
            }
            let firstword = sentencef[0];
            firstword = capflt(firstword);
            sentencef[0] = firstword;
            return sentencef.join(" ");
        };
        function ranint(max) {
            return Math.floor(Math.random() * max);
        }
        async function writebit(ele, sent){
            for (let i = 0; i <= sent.length; i++) {
                const charat = sent.split(" ")[i];
                const spn = document.createElement("span")
                if (charat === undefined) {
                    return
                }
                let boldify = false
                const probtoboldify = ranint(100)
                if (probtoboldify > 70) {
                    boldify = true
                }
                if (boldify) {
                    ele.innerHTML = ele.innerHTML.concat(" <b>"+charat+"</b>");
                } else {
                    ele.innerHTML = ele.innerHTML.concat(" "+charat);
                }
                await new Promise(resolve => setTimeout(resolve, 50));;
            }
        };   /*
        writebit does basically the same thing as writebitspans lol,
        except syntax highlighting.
        that's exclusive to writebitspans (writebit also does occasional text boldifying, its only used for text gen)
        */  
        async function writebitspans(ele, sent, tabele){
            for (let i = 0; i <= sent.length; i++) {
                const charat = sent.split(" ")[i]
                if (charat === undefined) {
                    return;
                }
                let highlightclassname = "normaltext"
                const newspan = document.createElement("span")
                newspan.style.fontFamily = "'Segoe UI'"
                newspan.style.fontSize = "10"
                let mark = false
                for (var construct of tabele) {
                    construct.txts.forEach(element => {
                        if (charat === element) {
                            highlightclassname = construct.classname
                        }
                    });
                }
                newspan.classList.add(highlightclassname)
                newspan.textContent = " "+charat+" "
                ele.appendChild(newspan)
                await new Promise(resolve => setTimeout(resolve, 20));;
            }
        };      
        function codegen(ele){
            const wordmount = Math.floor(Math.random() * 300);
            let sentencef = [];
            for (let i = 0; i < wordmount; i++) {
                const numbword = Math.floor(Math.random()*codepossibility.length);
                const pickedword = codepossibility[numbword];
                sentencef.push(pickedword);
            }
            let firstword = sentencef[0];
            firstword = capflt(firstword);
            sentencef[0] = firstword;
            writebitspans(ele, sentencef.join(" "), [{txts: ["def", "global", "private", "local", "static", "void", "public", "class", "struct"], classname: "rebtext"}, {txts: ["require"], classname: "blutext"}])
        }; /* codegen does the code n stuff... uses writebitspans */
        function gen(){
            if (event.key === "Enter") {
                /*and this i s where the magic happens, actual  input an stuff*/
